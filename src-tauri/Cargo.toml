[package]
name = "genesis-seek"
version = "0.1.0"
description = "Genesis Seek - Lightweight Cross-Platform Anti-Malware, Real-Time Guard & Browser Protection Suite"
authors = ["Genesis Seek Security"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
notify = "6.1"
sysinfo = "0.30"
walkdir = "2.5"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.8", features = ["v4", "serde"] }
once_cell = "1.19"
regex = "1.10"
dirs = "5.0"
ureq = "2.12"

[target.'cfg(target_os = "linux")'.dependencies]
gio = "0.18"
glib = "0.18"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
