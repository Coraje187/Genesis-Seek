<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="gsShieldGrad" x1="12" y1="8" x2="108" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00e5ff" />
      <stop offset="50%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="gsInnerGlow" x1="30" y1="20" x2="90" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.06" />
    </linearGradient>
    <linearGradient id="gsCoreGold" x1="42" y1="42" x2="78" y2="78" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#34d399" />
