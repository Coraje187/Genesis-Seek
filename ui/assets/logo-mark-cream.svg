<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="gsCreamGold" x1="14" y1="8" x2="106" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c69d53" />
      <stop offset="50%" stop-color="#9a7232" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <linearGradient id="gsCreamFill" x1="25" y1="16" x2="95" y2="104" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f5ebd6" />
      <stop offset="100%" stop-color="#e7d8bc" />
    </linearGradient>
    <linearGradient id="gsEmeraldGem" x1="42" y1="42" x2="78" y2="78" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981" />
