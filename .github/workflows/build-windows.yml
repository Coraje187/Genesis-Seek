name: Build Windows & Linux Releases

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    name: Build Windows Executable, Installer & Browser Guard
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Windows Release & Installers
        working-directory: src-tauri
        run: |
          cargo build --release
          npx --yes @tauri-apps/cli@^2.0.0 build || true

      - name: Package Windows ZIP & Browser Guard Extensions
        shell: pwsh
        run: |
          pwsh -ExecutionPolicy Bypass -File ./package_release.ps1

      - name: Upload Windows & Extension Assets to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.ref_name || 'v0.4.0' }}
          overwrite_files: true
          fail_on_unmatched_files: false
          body: |
            ## 🛡️ Genesis Seek Enterprise v0.4.0 — Mail Gateway, Stream Gateway & Zero-FP Installer Guard

            ### 🚀 What's New in v0.4.0:
            * **RFC 5322 Mail Gateway & Multi-Part MIME Unpacker (`scanner.rs`, `realtime_shield.rs`)**:
              - Inspects `.eml`, `.msg`, `.oft`, and `.mbox` mail spools alongside a live HTTP Mail Gateway API (`POST http://127.0.0.1:49152/gateway/scan-email`).
              - Parses headers (`From`, `Reply-To`, `Return-Path`, `Authentication-Results`) for display-name brand spoofing, cross-domain `Reply-To` phishing, and `spf=fail` / `dkim=fail` / `dmarc=fail` anomalies.
              - Recursively decodes `multipart/*` boundaries (`base64` & `quoted-printable`), inspects HTML body links for phishing/UNC/homograph URLs, and routes every attachment (`.zip`, `.tar.gz`, Office macros, PDFs, `.lnk`, executables) through the full 5-layer scanner.
            * **ICAP-Style Local Stream & Proxy Gateway (`POST /gateway/scan-stream`)**:
              - Scans raw byte streams in-memory (`127.0.0.1:49152/gateway/scan-stream`) for browser downloads, local proxies, and mail relays before files touch user folders.
            * **OS Network & DNS Sinkhole Gateway + Outbound WAN SMB Relay Guard (`threat_intel_and_net.rs`)**:
              - Optional OS-level `/etc/hosts` & `C:\Windows\System32\drivers\etc\hosts` DNS Sinkhole Gateway (`0.0.0.0`) protecting non-browser apps, mail clients, and CLI tools, with 1-click clean rollback.
              - Detects outbound port `445` (`SMB`) connections to public WAN IP addresses (`Exploit.Net.OutboundWanSmbRelay_CVE_2023_23397`) while allowing normal RFC 1918 LAN file shares.
            * **Zero False-Positive Installer & MSI Guard (`scanner.rs`, `process_guard.rs`, `realtime_shield.rs`)**:
              - Eliminates false-positive quarantines on Windows `.msi` packages (OLE2 Compound Documents), official software installers (`Firefox Installer.exe`, 7-Zip SFX `setup-stub.exe` / `7zS...` / `7zO...` temp folders), and in-progress browser downloads (`.crdownload`, `.part`, `.opdownload`).
            * **Includes All v0.3.8 Enterprise Engines**:
              - System Watcher pre-encryption shadow journal & automatic ransomware file rollback, live process memory hollowing & reflective DLL scanner, recursive `.zip`/`.tar.gz`/PDF/Office macro unpacker + optional `clamd` bridge, MS-SHLLINK `.lnk` & MotW inspector, and pure-Rust POSIX `.xpi` builder.

            ### 🌐 Browser Guard Extensions:
            * **Google Chrome, Microsoft Edge & Brave:**
              Download [`Genesis-Seek-Browser-Guard-for-Chrome-and-Edge-v0.4.0.zip`](https://github.com/Coraje187/Genesis-Seek/releases/download/v0.4.0/Genesis-Seek-Browser-Guard-for-Chrome-and-Edge-v0.4.0.zip) (Unpack and load via `chrome://extensions` or `edge://extensions` -> "Load unpacked").
            * **Mozilla Firefox:**
              Download [`Genesis-Seek-Browser-Guard-for-Firefox-v0.4.0.xpi`](https://github.com/Coraje187/Genesis-Seek/releases/download/v0.4.0/Genesis-Seek-Browser-Guard-for-Firefox-v0.4.0.xpi) (or install 1-click from [Mozilla AMO](https://addons.mozilla.org/en-US/firefox/addon/genesis-seek-browser-guard/)).
              Source zip: [`Genesis-Seek-Browser-Guard-for-Firefox-v0.4.0.zip`](https://github.com/Coraje187/Genesis-Seek/releases/download/v0.4.0/Genesis-Seek-Browser-Guard-for-Firefox-v0.4.0.zip).

            ### 🪟 Windows Desktop Application:
            * **Standalone Executable:** [`genesis-seek.exe`](https://github.com/Coraje187/Genesis-Seek/releases/download/v0.4.0/genesis-seek.exe)
            * **NSIS Setup Installer:** [`Genesis.Seek_0.4.0_x64-setup.exe`](https://github.com/Coraje187/Genesis-Seek/releases/download/v0.4.0/Genesis.Seek_0.4.0_x64-setup.exe)
            * **MSI Enterprise Package:** [`Genesis.Seek_0.4.0_x64_en-US.msi`](https://github.com/Coraje187/Genesis-Seek/releases/download/v0.4.0/Genesis.Seek_0.4.0_x64_en-US.msi)
            * **Complete Portable Archive:** [`genesis-seek-v0.4.0-windows-x86_64.zip`](https://github.com/Coraje187/Genesis-Seek/releases/download/v0.4.0/genesis-seek-v0.4.0-windows-x86_64.zip)

            ### 🐧 Linux Desktop Application:
            * **Standalone AppImage:** [`Genesis-Seek-0.4.0-x86_64.AppImage`](https://github.com/Coraje187/Genesis-Seek/releases/download/v0.4.0/Genesis-Seek-0.4.0-x86_64.AppImage)
            * **Debian / Ubuntu Package:** [`Genesis.Seek_0.4.0_amd64.deb`](https://github.com/Coraje187/Genesis-Seek/releases/download/v0.4.0/Genesis.Seek_0.4.0_amd64.deb)
            * **Portable Tarball:** [`genesis-seek-v0.4.0-linux-x86_64.tar.gz`](https://github.com/Coraje187/Genesis-Seek/releases/download/v0.4.0/genesis-seek-v0.4.0-linux-x86_64.tar.gz)
            * **1-Line Terminal Installer:** `curl -sSL https://raw.githubusercontent.com/Coraje187/Genesis-Seek/main/install.sh | bash`

            ---
            *© 2026 Genesis Grid Labs. Free, Secure, Plug-and-Play Local AI & Security Grid.*
          files: |
            release_assets/*.zip


            release_assets/Genesis-Seek-Browser-Guard-for-Firefox-*.xpi
            release_assets/genesis-seek.exe
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    name: Build Linux Binary, DEB & Tarball
    runs-on: ubuntu-22.04
    needs: build-windows
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Linux GTK & WebKit2GTK Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libfuse2

      - name: Setup Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Linux Release & DEB/AppImage
        working-directory: src-tauri
        run: |
          cargo build --release
          npx --yes @tauri-apps/cli@^2.0.0 build --bundles deb,appimage || npx --yes @tauri-apps/cli@^2.0.0 build --bundles deb || true

      - name: Package Standalone Linux Release Assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER="${{ github.ref_name }}"
          if [ -z "$VER" ]; then VER="v0.4.0"; fi
          CLEAN_VER="${VER#v}"
          TAR_NAME="genesis-seek-${VER}-linux-x86_64.tar.gz"
          tar -czvf "$TAR_NAME" -C src-tauri/target/release genesis-seek
          cp src-tauri/target/release/genesis-seek ./genesis-seek-linux-x86_64
          chmod +x ./genesis-seek-linux-x86_64
          if ls src-tauri/target/release/bundle/appimage/*.AppImage >/dev/null 2>&1; then
            RAW_APPIMAGE=$(ls src-tauri/target/release/bundle/appimage/*.AppImage | head -n 1)
            chmod +x "$RAW_APPIMAGE"
            # Extract, strip debug symbols, add smart AppRun wrapper, and repack with xz
            "$RAW_APPIMAGE" --appimage-extract
            find squashfs-root/usr/lib -type f -name "*.so*" -exec strip --strip-unneeded {} + 2>/dev/null || true
            if [ -f squashfs-root/AppRun ] && [ ! -L squashfs-root/AppRun ]; then
              mv squashfs-root/AppRun squashfs-root/AppRun.orig
              printf '%s\n' \
                '#!/bin/sh' \
                'HERE="$(dirname "$(readlink -f "$0")")"' \
                'export WEBKIT_DISABLE_DMABUF_RENDERER="${WEBKIT_DISABLE_DMABUF_RENDERER:-1}"' \
                'export WEBKIT_DISABLE_COMPOSITING_MODE="${WEBKIT_DISABLE_COMPOSITING_MODE:-1}"' \
                'if ! ldd "$HERE/usr/bin/genesis-seek" 2>/dev/null | grep -q "not found"; then' \
                '  exec "$HERE/usr/bin/genesis-seek" "$@"' \
                'fi' \
                'exec "$HERE/AppRun.orig" "$@"' > squashfs-root/AppRun
              chmod +x squashfs-root/AppRun
            fi
            wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool || true
            if [ -f appimagetool ]; then
              chmod +x appimagetool
              ARCH=x86_64 ./appimagetool --appimage-extract-and-run --comp xz --mksquashfs-opt "-b" --mksquashfs-opt "1048576" --mksquashfs-opt "-Xdict-size" --mksquashfs-opt "100%" squashfs-root "./Genesis-Seek-${CLEAN_VER}-x86_64.AppImage" || cp ./genesis-seek-linux-x86_64 "./Genesis-Seek-${CLEAN_VER}-x86_64.AppImage"
              rm -rf squashfs-root appimagetool
            else
              cp ./genesis-seek-linux-x86_64 "./Genesis-Seek-${CLEAN_VER}-x86_64.AppImage"
            fi
            chmod +x "./Genesis-Seek-${CLEAN_VER}-x86_64.AppImage"
            # Remove Tauri's raw default name so it doesn't get uploaded as a duplicate
            rm -f src-tauri/target/release/bundle/appimage/*.AppImage
          fi
          # Clean up any legacy duplicate file aliases on the release
          gh release delete-asset "$VER" "genesis-seek" --yes || true
          gh release delete-asset "$VER" "Genesis-Seek-x86_64.AppImage" --yes || true
          gh release delete-asset "$VER" "Genesis.Seek_${CLEAN_VER}_amd64.AppImage" --yes || true
          echo "TAR_NAME=$TAR_NAME" >> $GITHUB_ENV
          echo "APPIMAGE_NAME=Genesis-Seek-${CLEAN_VER}-x86_64.AppImage" >> $GITHUB_ENV

      - name: Upload Linux Assets to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.ref_name || 'v0.4.0' }}
          overwrite_files: true
          fail_on_unmatched_files: false
          files: |
            ${{ env.TAR_NAME }}
            genesis-seek-linux-x86_64
            ${{ env.APPIMAGE_NAME }}
            src-tauri/target/release/bundle/deb/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
