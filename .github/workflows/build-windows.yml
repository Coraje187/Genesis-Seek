name: Build Windows & Linux Releases

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    name: Build Windows Executable & Installer
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Windows Release & Installers
        working-directory: src-tauri
        run: |
          cargo build --release
          npx --yes @tauri-apps/cli@^2.0.0 build || true

      - name: Package Standalone Windows ZIP
        shell: pwsh
        run: |
          $ver = '${{ github.ref_name }}'
          if (-not $ver) { $ver = 'v0.3.0' }
          $zipName = "genesis-seek-$ver-windows-x86_64.zip"
          Compress-Archive -Path src-tauri/target/release/genesis-seek.exe -DestinationPath $zipName -Force
          echo "ZIP_NAME=$zipName" >> $env:GITHUB_ENV

      - name: Upload Windows Assets to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.ref_name || 'v0.3.0' }}
          files: |
            ${{ env.ZIP_NAME }}
            src-tauri/target/release/genesis-seek.exe
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    name: Build Linux Binary, DEB & Tarball
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Linux GTK & WebKit2GTK Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libfuse2

      - name: Setup Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Linux Release & DEB/AppImage
        working-directory: src-tauri
        run: |
          cargo build --release
          npx --yes @tauri-apps/cli@^2.0.0 build --bundles deb,appimage || npx --yes @tauri-apps/cli@^2.0.0 build --bundles deb || true

      - name: Package Standalone Linux Tarball & Clean Old 0.1.0 Release Assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER="${{ github.ref_name }}"
          if [ -z "$VER" ]; then VER="v0.3.0"; fi
          TAR_NAME="genesis-seek-${VER}-linux-x86_64.tar.gz"
          tar -czvf "$TAR_NAME" -C src-tauri/target/release genesis-seek
          cp src-tauri/target/release/genesis-seek ./genesis-seek-linux-x86_64
          chmod +x ./genesis-seek-linux-x86_64
          if ls src-tauri/target/release/bundle/appimage/*.AppImage >/dev/null 2>&1; then
            cp src-tauri/target/release/bundle/appimage/*.AppImage ./Genesis-Seek-0.3.0-x86_64.AppImage || true
          fi
          echo "TAR_NAME=$TAR_NAME" >> $GITHUB_ENV

      - name: Upload Linux Assets to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.ref_name || 'v0.3.0' }}
          files: |
            ${{ env.TAR_NAME }}
            genesis-seek-linux-x86_64
            Genesis-Seek-0.3.0-x86_64.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
