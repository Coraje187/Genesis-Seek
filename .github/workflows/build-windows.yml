name: Build Windows & Linux Releases

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    name: Build Windows Executable, Installer & Browser Guard
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Windows Release & Installers
        working-directory: src-tauri
        run: |
          cargo build --release
          npx --yes @tauri-apps/cli@^2.0.0 build || true

      - name: Package Windows ZIP & Browser Guard Extensions
        shell: pwsh
        run: |
          $ver = '${{ github.ref_name }}'
          if (-not $ver) { $ver = 'v0.3.0' }
          
          # 1. Package Browser Guard ZIP (Chrome, Edge, Brave) and XPI (Firefox)
          $extZip = "genesis-seek-browser-guard-$ver.zip"
          $extXpi = "genesis-seek-browser-guard-$ver.xpi"
          Compress-Archive -Path browser-extension/* -DestinationPath $extZip -Force
          Copy-Item $extZip $extXpi
          
          # 2. Package Complete Windows ZIP (exe + rules + extension + README)
          $zipName = "genesis-seek-$ver-windows-x86_64.zip"
          $winStaging = "win_staging"
          New-Item -ItemType Directory -Path $winStaging | Out-Null
          Copy-Item src-tauri/target/release/genesis-seek.exe $winStaging/genesis-seek.exe
          if (Test-Path rules) { Copy-Item -Recurse rules $winStaging/rules }
          if (Test-Path browser-extension) { Copy-Item -Recurse browser-extension $winStaging/browser-extension }
          if (Test-Path README.md) { Copy-Item README.md $winStaging/README.md }
          Compress-Archive -Path "$winStaging/*" -DestinationPath $zipName -Force
          Remove-Item -Recurse -Force $winStaging
          
          # 3. Package Linux Installer bundle
          $linZip = "genesis-seek-$ver-linux-installer.zip"
          $linStaging = "lin_staging"
          New-Item -ItemType Directory -Path $linStaging | Out-Null
          if (Test-Path install.sh) { Copy-Item install.sh $linStaging/install.sh }
          if (Test-Path rules) { Copy-Item -Recurse rules $linStaging/rules }
          if (Test-Path browser-extension) { Copy-Item -Recurse browser-extension $linStaging/browser-extension }
          if (Test-Path README.md) { Copy-Item README.md $linStaging/README.md }
          Compress-Archive -Path "$linStaging/*" -DestinationPath $linZip -Force
          Remove-Item -Recurse -Force $linStaging
          
          echo "ZIP_NAME=$zipName" >> $env:GITHUB_ENV
          echo "EXT_ZIP=$extZip" >> $env:GITHUB_ENV
          echo "EXT_XPI=$extXpi" >> $env:GITHUB_ENV
          echo "LIN_ZIP=$linZip" >> $env:GITHUB_ENV

      - name: Upload Windows & Extension Assets to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.ref_name || 'v0.3.0' }}
          files: |
            ${{ env.ZIP_NAME }}
            ${{ env.EXT_ZIP }}
            ${{ env.EXT_XPI }}
            ${{ env.LIN_ZIP }}
            src-tauri/target/release/genesis-seek.exe
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    name: Build Linux Binary, DEB & Tarball
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Linux GTK & WebKit2GTK Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libfuse2

      - name: Setup Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Linux Release & DEB/AppImage
        working-directory: src-tauri
        run: |
          cargo build --release
          npx --yes @tauri-apps/cli@^2.0.0 build --bundles deb,appimage || npx --yes @tauri-apps/cli@^2.0.0 build --bundles deb || true

      - name: Package Standalone Linux Tarball & Clean Old 0.1.0 Release Assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER="${{ github.ref_name }}"
          if [ -z "$VER" ]; then VER="v0.3.0"; fi
          TAR_NAME="genesis-seek-${VER}-linux-x86_64.tar.gz"
          tar -czvf "$TAR_NAME" -C src-tauri/target/release genesis-seek
          cp src-tauri/target/release/genesis-seek ./genesis-seek-linux-x86_64
          chmod +x ./genesis-seek-linux-x86_64
          if ls src-tauri/target/release/bundle/appimage/*.AppImage >/dev/null 2>&1; then
            cp src-tauri/target/release/bundle/appimage/*.AppImage ./Genesis-Seek-0.3.0-x86_64.AppImage || true
          fi
          echo "TAR_NAME=$TAR_NAME" >> $GITHUB_ENV

      - name: Upload Linux Assets to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.ref_name || 'v0.3.0' }}
          files: |
            ${{ env.TAR_NAME }}
            genesis-seek-linux-x86_64
            Genesis-Seek-0.3.0-x86_64.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
