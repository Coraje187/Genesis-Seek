name: Build Windows & Linux Releases

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    name: Build Windows Executable, Installer & Browser Guard
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Windows Release & Installers
        working-directory: src-tauri
        run: |
          cargo build --release
          npx --yes @tauri-apps/cli@^2.0.0 build || true

      - name: Package Windows ZIP & Browser Guard Extensions
        shell: pwsh
        run: |
          $ver = '${{ github.ref_name }}'
          if (-not $ver) { $ver = 'v0.3.0' }

          # 1. Package Chrome, Microsoft Edge & Brave Extension (service_worker Manifest V3)
          $chromeStage = "chrome_edge_stage"
          New-Item -ItemType Directory -Path $chromeStage | Out-Null
          Copy-Item -Recurse browser-extension/* $chromeStage
          $chromeManifest = @"
          {
            "manifest_version": 3,
            "name": "Genesis Seek Browser Guard",
            "version": "0.3.0",
            "description": "Real-time phishing, IDN homograph, cryptojacking, and drive-by malware blocker synced with Genesis Seek Endpoint Defense.",
            "permissions": ["tabs", "storage", "declarativeNetRequest"],
            "host_permissions": ["<all_urls>", "http://127.0.0.1:49152/*"],
            "background": { "service_worker": "background.js" },
            "content_scripts": [{ "matches": ["<all_urls>"], "js": ["content_guard.js"], "run_at": "document_idle" }],
            "declarative_net_request": { "rule_resources": [{ "id": "genesis_seek_blocklist", "enabled": true, "path": "rules.json" }] },
            "icons": { "16": "icons/icon-16.png", "32": "icons/icon-32.png", "48": "icons/icon-48.png", "128": "icons/icon-128.png" },
            "action": { "default_title": "Genesis Seek Browser Guard", "default_popup": "popup.html", "default_icon": { "16": "icons/icon-16.png", "32": "icons/icon-32.png" } }
          }
"@
          Set-Content -Path "$chromeStage/manifest.json" -Value $chromeManifest -Encoding UTF8
          $chromeZip = "Genesis-Seek-Browser-Guard-for-Chrome-and-Edge-$ver.zip"
          Compress-Archive -Path "$chromeStage/*" -DestinationPath $chromeZip -Force
          Remove-Item -Recurse -Force $chromeStage

          # 2. Package Firefox Extension (scripts + gecko Manifest V3)
          $ffStage = "firefox_stage"
          New-Item -ItemType Directory -Path $ffStage | Out-Null
          Copy-Item -Recurse browser-extension/* $ffStage
          $ffManifest = @"
          {
            "manifest_version": 3,
            "name": "Genesis Seek Browser Guard",
            "version": "0.3.0",
            "description": "Real-time phishing, IDN homograph, cryptojacking, and drive-by malware blocker synced with Genesis Seek Endpoint Defense.",
            "permissions": ["tabs", "storage", "declarativeNetRequest"],
            "host_permissions": ["<all_urls>", "http://127.0.0.1:49152/*"],
            "background": { "scripts": ["background.js"] },
            "browser_specific_settings": {
              "gecko": {
                "id": "browser-guard@genesisseek.io",
                "strict_min_version": "109.0",
                "data_collection_permissions": { "required": ["none"] }
              }
            },
            "content_scripts": [{ "matches": ["<all_urls>"], "js": ["content_guard.js"], "run_at": "document_idle" }],
            "declarative_net_request": { "rule_resources": [{ "id": "genesis_seek_blocklist", "enabled": true, "path": "rules.json" }] },
            "icons": { "16": "icons/icon-16.png", "32": "icons/icon-32.png", "48": "icons/icon-48.png", "128": "icons/icon-128.png" },
            "action": { "default_title": "Genesis Seek Browser Guard", "default_popup": "popup.html", "default_icon": { "16": "icons/icon-16.png", "32": "icons/icon-32.png" } }
          }
"@
          Set-Content -Path "$ffStage/manifest.json" -Value $ffManifest -Encoding UTF8
          $ffZip = "Genesis-Seek-Browser-Guard-for-Firefox-$ver.zip"
          $ffXpi = "Genesis-Seek-Browser-Guard-for-Firefox-$ver.xpi"
          Compress-Archive -Path "$ffStage/*" -DestinationPath $ffZip -Force
          Copy-Item $ffZip $ffXpi
          Remove-Item -Recurse -Force $ffStage

          # 3. Package Complete Windows ZIP (exe + rules + extension + README)
          $zipName = "genesis-seek-$ver-windows-x86_64.zip"
          $winStaging = "win_staging"
          New-Item -ItemType Directory -Path $winStaging | Out-Null
          Copy-Item src-tauri/target/release/genesis-seek.exe $winStaging/genesis-seek.exe
          if (Test-Path rules) { Copy-Item -Recurse rules $winStaging/rules }
          if (Test-Path browser-extension) { Copy-Item -Recurse browser-extension $winStaging/browser-extension }
          if (Test-Path README.md) { Copy-Item README.md $winStaging/README.md }
          Compress-Archive -Path "$winStaging/*" -DestinationPath $zipName -Force
          Remove-Item -Recurse -Force $winStaging

          # 4. Package Linux Installer bundle
          $linZip = "genesis-seek-$ver-linux-installer.zip"
          $linStaging = "lin_staging"
          New-Item -ItemType Directory -Path $linStaging | Out-Null
          if (Test-Path install.sh) { Copy-Item install.sh $linStaging/install.sh }
          if (Test-Path rules) { Copy-Item -Recurse rules $linStaging/rules }
          if (Test-Path browser-extension) { Copy-Item -Recurse browser-extension $linStaging/browser-extension }
          if (Test-Path README.md) { Copy-Item README.md $linStaging/README.md }
          Compress-Archive -Path "$linStaging/*" -DestinationPath $linZip -Force
          Remove-Item -Recurse -Force $linStaging

          echo "ZIP_NAME=$zipName" >> $env:GITHUB_ENV
          echo "CHROME_ZIP=$chromeZip" >> $env:GITHUB_ENV
          echo "FF_ZIP=$ffZip" >> $env:GITHUB_ENV
          echo "FF_XPI=$ffXpi" >> $env:GITHUB_ENV
          echo "LIN_ZIP=$linZip" >> $env:GITHUB_ENV

      - name: Upload Windows & Extension Assets to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.ref_name || 'v0.3.0' }}
          body: |
            ## 🛡️ Genesis Seek Enterprise v0.3.0 — Release Assets Guide

            ### 🌐 Browser Guard Extensions:
            * **Google Chrome, Microsoft Edge & Brave:**
              Download [`Genesis-Seek-Browser-Guard-for-Chrome-and-Edge-v0.3.0.zip`](https://github.com/Coraje187/Genesis-Seek/releases/download/v0.3.0/Genesis-Seek-Browser-Guard-for-Chrome-and-Edge-v0.3.0.zip) (Unpack and load via `chrome://extensions` or `edge://extensions` -> "Load unpacked").
            * **Mozilla Firefox:**
              Download [`Genesis-Seek-Browser-Guard-for-Firefox-v0.3.0.xpi`](https://github.com/Coraje187/Genesis-Seek/releases/download/v0.3.0/Genesis-Seek-Browser-Guard-for-Firefox-v0.3.0.xpi) (or install 1-click from [Mozilla AMO](https://addons.mozilla.org/en-US/firefox/addon/genesis-seek-browser-guard/)).
              Source zip: [`Genesis-Seek-Browser-Guard-for-Firefox-v0.3.0.zip`](https://github.com/Coraje187/Genesis-Seek/releases/download/v0.3.0/Genesis-Seek-Browser-Guard-for-Firefox-v0.3.0.zip).

            ### 🪟 Windows Desktop Application:
            * **Standalone Executable:** [`genesis-seek.exe`](https://github.com/Coraje187/Genesis-Seek/releases/download/v0.3.0/genesis-seek.exe)
            * **NSIS Setup Installer:** [`Genesis.Seek_0.3.0_x64-setup.exe`](https://github.com/Coraje187/Genesis-Seek/releases/download/v0.3.0/Genesis.Seek_0.3.0_x64-setup.exe)
            * **MSI Enterprise Package:** [`Genesis.Seek_0.3.0_x64_en-US.msi`](https://github.com/Coraje187/Genesis-Seek/releases/download/v0.3.0/Genesis.Seek_0.3.0_x64_en-US.msi)
            * **Complete Portable Archive:** [`genesis-seek-v0.3.0-windows-x86_64.zip`](https://github.com/Coraje187/Genesis-Seek/releases/download/v0.3.0/genesis-seek-v0.3.0-windows-x86_64.zip)

            ### 🐧 Linux Desktop Application:
            * **Standalone AppImage:** [`Genesis-Seek-0.3.0-x86_64.AppImage`](https://github.com/Coraje187/Genesis-Seek/releases/download/v0.3.0/Genesis-Seek-0.3.0-x86_64.AppImage)
            * **Debian / Ubuntu Package:** [`Genesis.Seek_0.3.0_amd64.deb`](https://github.com/Coraje187/Genesis-Seek/releases/download/v0.3.0/Genesis.Seek_0.3.0_amd64.deb)
            * **Portable Tarball:** [`genesis-seek-v0.3.0-linux-x86_64.tar.gz`](https://github.com/Coraje187/Genesis-Seek/releases/download/v0.3.0/genesis-seek-v0.3.0-linux-x86_64.tar.gz)
            * **1-Line Terminal Installer:** `curl -sSL https://raw.githubusercontent.com/Coraje187/Genesis-Seek/main/install.sh | bash`

            ---
            *© 2026 Genesis Grid Labs. Free, Secure, Plug-and-Play Local AI & Security Grid.*
          files: |
            ${{ env.ZIP_NAME }}
            ${{ env.CHROME_ZIP }}
            ${{ env.FF_ZIP }}
            ${{ env.FF_XPI }}
            ${{ env.LIN_ZIP }}
            src-tauri/target/release/genesis-seek.exe
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    name: Build Linux Binary, DEB & Tarball
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Linux GTK & WebKit2GTK Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libfuse2

      - name: Setup Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Linux Release & DEB/AppImage
        working-directory: src-tauri
        run: |
          cargo build --release
          npx --yes @tauri-apps/cli@^2.0.0 build --bundles deb,appimage || npx --yes @tauri-apps/cli@^2.0.0 build --bundles deb || true

      - name: Package Standalone Linux Tarball & Clean Old 0.1.0 Release Assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER="${{ github.ref_name }}"
          if [ -z "$VER" ]; then VER="v0.3.0"; fi
          TAR_NAME="genesis-seek-${VER}-linux-x86_64.tar.gz"
          tar -czvf "$TAR_NAME" -C src-tauri/target/release genesis-seek
          cp src-tauri/target/release/genesis-seek ./genesis-seek-linux-x86_64
          chmod +x ./genesis-seek-linux-x86_64
          if ls src-tauri/target/release/bundle/appimage/*.AppImage >/dev/null 2>&1; then
            cp src-tauri/target/release/bundle/appimage/*.AppImage ./Genesis-Seek-0.3.0-x86_64.AppImage || true
          fi
          echo "TAR_NAME=$TAR_NAME" >> $GITHUB_ENV

      - name: Upload Linux Assets to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.ref_name || 'v0.3.0' }}
          files: |
            ${{ env.TAR_NAME }}
            genesis-seek-linux-x86_64
            Genesis-Seek-0.3.0-x86_64.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
