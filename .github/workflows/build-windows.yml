name: Build Windows Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    name: Build Windows Executable & Installer
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version ^2.0.0 --locked

      - name: Build Windows Release
        run: |
          cargo build --release --manifest-path src-tauri/Cargo.toml
          cargo tauri build --project ./src-tauri

      - name: Package Standalone Windows ZIP
        shell: pwsh
        run: |
          $ver = '${{ github.ref_name }}'
          if (-not $ver) { $ver = 'v0.1.0' }
          $zipName = "genesis-seek-$ver-windows-x86_64.zip"
          Compress-Archive -Path src-tauri/target/release/genesis-seek.exe -DestinationPath $zipName
          echo "ZIP_NAME=$zipName" >> $env:GITHUB_ENV

      - name: Upload Windows Assets to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.ref_name || 'v0.1.0' }}
          files: |
            ${{ env.ZIP_NAME }}
            src-tauri/target/release/genesis-seek.exe
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
