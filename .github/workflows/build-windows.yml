name: Build Windows & Linux Releases

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    name: Build Windows Executable, Installer & Browser Guard
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Windows Release & Installers
        working-directory: src-tauri
        run: |
          cargo build --release
          npx --yes @tauri-apps/cli@^2.0.0 build || true

      - name: Package Windows ZIP & Browser Guard Extensions
        shell: pwsh
        run: |
          pwsh -ExecutionPolicy Bypass -File ./package_release.ps1

      - name: Upload Windows & Extension Assets to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.ref_name || 'v0.3.2' }}
          overwrite_files: true
          fail_on_unmatched_files: false
          body: |
            ## 🛡️ Genesis Seek Enterprise v0.3.2 — Release Assets Guide

            ### 🌐 Browser Guard Extensions:
            * **Google Chrome, Microsoft Edge & Brave:**
              Download [`Genesis-Seek-Browser-Guard-for-Chrome-and-Edge-v0.3.2.zip`](https://github.com/Coraje187/Genesis-Seek/releases/download/v0.3.2/Genesis-Seek-Browser-Guard-for-Chrome-and-Edge-v0.3.2.zip) (Unpack and load via `chrome://extensions` or `edge://extensions` -> "Load unpacked").
            * **Mozilla Firefox:**
              Download [`Genesis-Seek-Browser-Guard-for-Firefox-v0.3.2.xpi`](https://github.com/Coraje187/Genesis-Seek/releases/download/v0.3.2/Genesis-Seek-Browser-Guard-for-Firefox-v0.3.2.xpi) (or install 1-click from [Mozilla AMO](https://addons.mozilla.org/en-US/firefox/addon/genesis-seek-browser-guard/)).
              Source zip: [`Genesis-Seek-Browser-Guard-for-Firefox-v0.3.2.zip`](https://github.com/Coraje187/Genesis-Seek/releases/download/v0.3.2/Genesis-Seek-Browser-Guard-for-Firefox-v0.3.2.zip).

            ### 🪟 Windows Desktop Application:
            * **Standalone Executable:** [`genesis-seek.exe`](https://github.com/Coraje187/Genesis-Seek/releases/download/v0.3.2/genesis-seek.exe)
            * **NSIS Setup Installer:** [`Genesis.Seek_0.3.2_x64-setup.exe`](https://github.com/Coraje187/Genesis-Seek/releases/download/v0.3.2/Genesis.Seek_0.3.2_x64-setup.exe)
            * **MSI Enterprise Package:** [`Genesis.Seek_0.3.2_x64_en-US.msi`](https://github.com/Coraje187/Genesis-Seek/releases/download/v0.3.2/Genesis.Seek_0.3.2_x64_en-US.msi)
            * **Complete Portable Archive:** [`genesis-seek-v0.3.2-windows-x86_64.zip`](https://github.com/Coraje187/Genesis-Seek/releases/download/v0.3.2/genesis-seek-v0.3.2-windows-x86_64.zip)

            ### 🐧 Linux Desktop Application:
            * **Standalone AppImage:** [`Genesis-Seek-0.3.2-x86_64.AppImage`](https://github.com/Coraje187/Genesis-Seek/releases/download/v0.3.2/Genesis-Seek-0.3.2-x86_64.AppImage)
            * **Debian / Ubuntu Package:** [`Genesis.Seek_0.3.2_amd64.deb`](https://github.com/Coraje187/Genesis-Seek/releases/download/v0.3.2/Genesis.Seek_0.3.2_amd64.deb)
            * **Portable Tarball:** [`genesis-seek-v0.3.2-linux-x86_64.tar.gz`](https://github.com/Coraje187/Genesis-Seek/releases/download/v0.3.2/genesis-seek-v0.3.2-linux-x86_64.tar.gz)
            * **1-Line Terminal Installer:** `curl -sSL https://raw.githubusercontent.com/Coraje187/Genesis-Seek/main/install.sh | bash`

            ---
            *© 2026 Genesis Grid Labs. Free, Secure, Plug-and-Play Local AI & Security Grid.*
          files: |
            release_assets/genesis-seek-*.zip
            release_assets/Genesis-Seek-Browser-Guard-for-Chrome-and-Edge-*.zip
            release_assets/Genesis-Seek-Browser-Guard-for-Firefox-*.zip
            release_assets/Genesis-Seek-Browser-Guard-for-Firefox-*.xpi
            release_assets/genesis-seek.exe
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    name: Build Linux Binary, DEB & Tarball
    runs-on: ubuntu-22.04
    needs: build-windows
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Linux GTK & WebKit2GTK Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libfuse2

      - name: Setup Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Linux Release & DEB/AppImage
        working-directory: src-tauri
        run: |
          cargo build --release
          npx --yes @tauri-apps/cli@^2.0.0 build --bundles deb,appimage || npx --yes @tauri-apps/cli@^2.0.0 build --bundles deb || true

      - name: Package Standalone Linux Tarball & Clean Old 0.1.0 Release Assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER="${{ github.ref_name }}"
          if [ -z "$VER" ]; then VER="v0.3.2"; fi
          TAR_NAME="genesis-seek-${VER}-linux-x86_64.tar.gz"
          tar -czvf "$TAR_NAME" -C src-tauri/target/release genesis-seek
          cp src-tauri/target/release/genesis-seek ./genesis-seek-linux-x86_64
          cp src-tauri/target/release/genesis-seek ./genesis-seek
          chmod +x ./genesis-seek-linux-x86_64 ./genesis-seek
          if ls src-tauri/target/release/bundle/appimage/*.AppImage >/dev/null 2>&1; then
            cp src-tauri/target/release/bundle/appimage/*.AppImage ./Genesis-Seek-0.3.2-x86_64.AppImage || true
            cp src-tauri/target/release/bundle/appimage/*.AppImage ./Genesis-Seek-x86_64.AppImage || true
          fi
          echo "TAR_NAME=$TAR_NAME" >> $GITHUB_ENV

      - name: Upload Linux Assets to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.ref_name || 'v0.3.2' }}
          overwrite_files: true
          fail_on_unmatched_files: false
          files: |
            ${{ env.TAR_NAME }}
            genesis-seek-linux-x86_64
            genesis-seek
            Genesis-Seek-0.3.2-x86_64.AppImage
            Genesis-Seek-x86_64.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
